name: Feature request
description: An idea for something Empire Engine should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the game or workflow you can't build today, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Empire Engine to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
